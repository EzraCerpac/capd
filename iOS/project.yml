name: CapdPhone
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  CapdDesignSystem:
    path: ../Packages/CapdDesignSystem
  CapdSync:
    path: ../Packages/CapdSync
  CapdMobile:
    path: ../Packages/CapdMobile
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
targets:
  CapdPhone:
    type: application
    platform: iOS
    sources: [App, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jxd.capd.iphone.prototype
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: Shared/CapdPhone.entitlements
    dependencies:
      - package: CapdMobile
      - package: CapdDesignSystem
      - target: CapdPhoneShare
        embed: true
  CapdPhoneShare:
    type: app-extension
    platform: iOS
    sources: [ShareExtension, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jxd.capd.iphone.prototype.share
        INFOPLIST_FILE: ShareExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: Shared/CapdPhone.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    dependencies:
      - package: CapdMobile
      - package: CapdDesignSystem
  CapdPhoneUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jxd.capd.iphone.prototype.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: CapdPhone
    dependencies:
      - target: CapdPhone
      - package: CapdSync
  CapdPhoneFixtureHost:
    type: application
    platform: iOS
    sources: [FixtureHost]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jxd.capd.iphone.fixture
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "capd share fixture"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
schemes:
  CapdPhone:
    build:
      targets:
        CapdPhone: all
        CapdPhoneFixtureHost: [test]
    test:
      targets: [CapdPhoneUITests]
      environmentVariables:
        CAPD_REFERENCE_PORT: $(CAPD_REFERENCE_PORT)
        CAPD_MAC_FIXTURE_PORT: $(CAPD_MAC_FIXTURE_PORT)
