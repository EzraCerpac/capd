name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      # swift-format's default rules drift between toolchain minors, so an
      # unpinned Xcode lets lint pass locally and fail here.
      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Lint
        run: |
          paths=(Sources Tests Package.swift)
          for path in Packages/*/Sources Packages/*/Tests Packages/*/Package.swift iOS/App iOS/Shared iOS/ShareExtension iOS/UITests; do
            if test -e "$path"; then paths+=("$path"); fi
          done
          swift format lint --strict --recursive --parallel "${paths[@]}"

  build-test:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      # Foundation Models token budgeting needs SDK 26.4; this stable Xcode is
      # installed on macos-26. Lint keeps its existing formatter version.
      - name: Select Xcode 26.4.1
        run: sudo xcode-select -s /Applications/Xcode_26.4.1.app

      - name: Verify source and report toolchain
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          git rev-parse HEAD
          xcodebuild -version
          swift --version
          xcrun --sdk macosx --show-sdk-version

      - uses: actions/cache@v6
        with:
          path: .build
          key: spm-debug-xcode-26.4.1-${{ github.event.repository.name }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.resolved', 'Packages/**/Package.resolved') }}
          restore-keys: |
            spm-debug-xcode-26.4.1-${{ github.event.repository.name }}-${{ runner.os }}-${{ runner.arch }}-

      - name: Build Mac app and share extension
        run: |
          swift build --product CapdApp --jobs 4
          swift build --product CapdShareExtension --jobs 4

      - name: Build HTTP integration fixture
        run: |
          if test -f Packages/CapdSyncServer/Package.swift; then
            swift build --package-path Packages/CapdSyncServer --product capd-sync-server --jobs 4
          fi

      - name: Test snapshot and migration helpers
        run: |
          if test -f Scripts/test_synthetic_library_migration.py; then
            /usr/bin/python3 -m unittest discover -s Scripts -p 'test_*library*.py' -v
          fi

      - name: Test
        run: swift test --parallel

      - name: Test portable packages
        run: |
          for package in CapdSync CapdSyncServer CapdSyncAdmin CapdMobile CapdSystemIntegration CapdAnswers CapdMCP; do
            if test -f "Packages/$package/Package.swift"; then
              swift test --package-path "Packages/$package" --jobs 4 --no-parallel
            fi
          done

  ios-simulator:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Select Xcode 26.4.1
        if: hashFiles('iOS/project.yml') != ''
        run: sudo xcode-select -s /Applications/Xcode_26.4.1.app

      - name: Verify source and report toolchain
        if: hashFiles('iOS/project.yml') != ''
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          git rev-parse HEAD
          xcodebuild -version
          swift --version
          xcrun --sdk iphonesimulator --show-sdk-version

      - name: Install XcodeGen
        if: hashFiles('iOS/project.yml') != ''
        run: brew install xcodegen
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"

      - name: Build unsigned iOS simulator app and share extension
        if: hashFiles('iOS/project.yml') != ''
        run: |
          xcodegen generate --spec iOS/project.yml
          xcodebuild -project iOS/CapdPhone.xcodeproj -scheme CapdPhone \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/capd-ios-derived-data" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

  raycast:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: raycast
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: raycast/package-lock.json

      - name: Install
        run: npm ci

      # `ray build` typechecks and, before that, generates raycast-env.d.ts from the
      # manifest — the source uses those generated Preferences and Arguments types, so
      # a bare `tsc` here would not compile.
      - name: Check
        run: |
          npx ray build -e dist
          npx eslint .
          npx prettier --check "src/**/*.{ts,tsx}" "test/**/*.ts"
          npx vitest run

  performance:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Select Xcode 26.4.1
        run: sudo xcode-select -s /Applications/Xcode_26.4.1.app

      - uses: actions/cache@v6
        with:
          path: .build
          key: spm-release-xcode-26.4.1-${{ github.event.repository.name }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.resolved', 'Packages/**/Package.resolved') }}
          restore-keys: |
            spm-release-xcode-26.4.1-${{ github.event.repository.name }}-${{ runner.os }}-${{ runner.arch }}-

      # The perf gate only means something against optimized code, and its timing
      # assertions need the box to itself, so it runs serial in its own job.
      # The widened budget absorbs virtualized-runner noise (observed p95 up to
      # 12ms against the 10ms user-hardware default) while still failing loudly
      # on a real regression.
      - name: Performance (release)
        run: swift test -c release --filter SearchPerformanceTests
        env:
          CAPD_SEARCH_PERF_BUDGET_MS: "20"
